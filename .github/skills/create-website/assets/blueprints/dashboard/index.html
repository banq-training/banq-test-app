<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Team Dashboard</title>
    <link rel="stylesheet" href="css/workshop.css">
    <style>
        .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.8rem; margin-bottom: 1rem; }
        .toolbar .tabs { flex-wrap: wrap; max-width: 100%; border-radius: 20px; }
        .kpi { display: grid; gap: 0.1rem; align-content: start; }
        .kpi span { color: var(--muted); font-weight: 650; }
        .kpi strong { font-size: 2rem; line-height: 1.15; font-weight: 800; color: var(--accent-strong); overflow-wrap: anywhere; }
        .kpi small { color: var(--muted); font-size: 0.85rem; }
        .charts { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 1rem; margin-bottom: 1rem; }
        .charts .panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.6rem; align-content: start; min-width: 0; }
        .what-if { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; color: var(--muted); font-weight: 650; }
        .what-if input { width: 150px; accent-color: var(--accent); }
        .what-if strong { min-width: 3.2rem; color: var(--accent-strong); }
        .table-wrap { overflow-x: auto; margin-top: 0.6rem; }
        .numbers { width: 100%; border-collapse: collapse; }
        .numbers th, .numbers td { padding: 0.3rem 0.4rem; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
        .numbers th:first-child, .numbers td:first-child { text-align: left; }
        .numbers th { color: var(--muted); font-size: 0.85rem; }
        .cell { width: 6rem; min-height: 36px; padding: 0.3rem 0.5rem; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); text-align: right; }
        .cell.month { width: 5.5rem; text-align: left; font-weight: 650; }
        @media (max-width: 860px) { .charts { grid-template-columns: minmax(0, 1fr); } }
    </style>
</head>
<body data-theme="green">
    <header class="app-header">
        <div class="container hero">
            <div>
                <p class="logo"><span class="logo-mark" aria-hidden="true">M</span>My Team Dashboard</p>
                <h1>See the numbers at a glance</h1>
                <p>Pick a region, change any number in the table, and every chart updates.</p>
            </div>
            <img class="hero-art" src="art/hero-dashboard.svg" alt="">
        </div>
    </header>

    <main class="container main">
        <section class="panel toolbar animate-in" aria-label="Filter">
            <div class="tabs" role="group" aria-label="Region" id="filters"></div>
            <span class="muted" id="period"></span>
        </section>

        <section class="kpis" aria-label="Key numbers">
            <div class="panel kpi animate-in" style="--i: 1"><span id="k-total-label">Total</span><strong id="k-total">0</strong><small id="k-total-note"></small></div>
            <div class="panel kpi animate-in" style="--i: 2"><span>Latest month</span><strong id="k-latest">0</strong><small id="k-change"></small></div>
            <div class="panel kpi animate-in" style="--i: 3"><span>On time</span><strong id="k-ontime">0%</strong><small>average of the months, all regions</small></div>
            <div class="panel kpi animate-in" style="--i: 4"><span>Biggest region</span><strong id="k-top">-</strong><small id="k-top-note"></small></div>
        </section>

        <section class="charts">
            <div class="panel animate-in" style="--i: 5">
                <div class="row spread">
                    <h2>Month by month</h2>
                    <label class="what-if">What if we grow
                        <input type="range" id="growth" min="-10" max="20" step="1" value="5">
                        <strong id="growth-value">5%</strong> a month?</label>
                </div>
                <div class="chart" id="trend-chart" role="img" aria-label="Numbers for each month, with a dashed three-month forecast"></div>
            </div>
            <div class="panel animate-in" style="--i: 6">
                <h2>Share by region</h2>
                <div class="chart" id="share-chart" role="img" aria-label="Each region's share of the total"></div>
            </div>
        </section>

        <section class="panel animate-in" style="--i: 7" aria-label="The numbers">
            <div class="row spread">
                <h2>The numbers</h2>
                <button class="ghost" id="add-month" type="button">+ Add a month</button>
            </div>
            <div class="table-wrap">
                <table class="numbers">
                    <thead id="numbers-head"></thead>
                    <tbody id="numbers-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="page-footer">Your numbers are remembered in this browser.</footer>

    <script src="js/workshop.js"></script>
    <script src="js/vendor/echarts.min.js"></script>
    <script src="js/workshop-charts.js"></script>
    <script>
        const { el, store, loadJSON, toast, flash, newId, chart, chartColors } = window.Workshop
        const SAMPLE = {
            measure: 'Requests',
            groups: ['Northeast', 'South', 'Midwest', 'West'],
            items: [
                { id: 'm1', month: 'Jan', values: [120, 95, 80, 105], onTime: 91 },
                { id: 'm2', month: 'Feb', values: [130, 98, 85, 110], onTime: 92 },
                { id: 'm3', month: 'Mar', values: [142, 104, 88, 118], onTime: 90 },
                { id: 'm4', month: 'Apr', values: [150, 110, 92, 125], onTime: 93 },
                { id: 'm5', month: 'May', values: [158, 115, 97, 131], onTime: 94 },
                { id: 'm6', month: 'Jun', values: [165, 121, 101, 138], onTime: 95 },
            ],
        }
        const saved = store('team-dashboard')
        let state = SAMPLE
        let view = 'All'
        // Months are the learner's entries; an empty table loads the examples again.
        const valid = data => data && Array.isArray(data.items) && data.items.length > 0
            && data.items.every(item => Array.isArray(item.values))

        const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
        const nextMonth = label => MONTHS.includes(label) ? MONTHS[(MONTHS.indexOf(label) + 1) % 12] : `${label} +1`
        const number = value => Math.round(value).toLocaleString('en-US')
        const sum = list => list.reduce((total, value) => total + (Number(value) || 0), 0)
        // Values line up with the groups by position, so renaming a group keeps its numbers.
        const valueOf = (item, group) => Number(item.values[state.groups.indexOf(group)]) || 0
        const monthTotal = item => view === 'All' ? sum(item.values.slice(0, state.groups.length)) : valueOf(item, view)
        const groupTotal = group => sum(state.items.map(item => valueOf(item, group)))

        function save(message, changed) {
            saved.save(state)
            drawSummary()
            if (message) toast(message)
            if (changed) flash(changed)
        }

        function drawSummary() {
            if (!state.items.length) return
            const totals = state.items.map(monthTotal)
            const total = sum(totals)
            const latest = totals[totals.length - 1] || 0
            const previous = totals[totals.length - 2]
            const growth = Number(document.getElementById('growth').value)
            const grandTotal = sum(state.groups.map(groupTotal))
            const ranked = state.groups.map(group => ({ group, total: groupTotal(group) })).sort((a, b) => b.total - a.total)
            const first = state.items[0]
            const last = state.items[state.items.length - 1]

            document.getElementById('period').textContent = `${first.month} to ${last.month}: ${state.items.length} months`
            document.getElementById('k-total-label').textContent = `Total ${state.measure.toLowerCase()}`
            document.getElementById('k-total').textContent = number(total)
            document.getElementById('k-total-note').textContent = view === 'All' ? 'all regions' : `${view} only`
            document.getElementById('k-latest').textContent = number(latest)
            document.getElementById('k-change').textContent = previous
                ? `${latest >= previous ? '+' : ''}${(((latest - previous) / previous) * 100).toFixed(1)}% on ${state.items[state.items.length - 2].month}`
                : 'first month'
            document.getElementById('k-ontime').textContent = `${(sum(state.items.map(item => item.onTime)) / state.items.length).toFixed(1)}%`
            document.getElementById('k-top').textContent = ranked[0].group
            document.getElementById('k-top-note').textContent = `${number(ranked[0].total)}, ${grandTotal ? Math.round((ranked[0].total / grandTotal) * 100) : 0}% of all`
            document.getElementById('growth-value').textContent = `${growth}%`

            // The forecast starts at the latest month and grows by the chosen percentage each month.
            const future = []
            let label = last.month
            for (let step = 1; step <= 3; step += 1) {
                label = nextMonth(label)
                future.push({ month: label, value: Math.round(latest * (1 + growth / 100) ** step) })
            }
            const months = [...state.items.map(item => item.month), ...future.map(entry => entry.month)]
            const blanks = future.map(() => null)
            const shownGroups = view === 'All' ? state.groups : [view]
            const colors = chartColors()
            chart('#trend-chart', {
                tooltip: { trigger: 'axis' },
                legend: { top: 0, type: 'scroll' },
                grid: { left: 8, right: 12, top: 40, bottom: 8, containLabel: true },
                xAxis: { type: 'category', data: months },
                yAxis: { type: 'value', splitLine: { lineStyle: { color: colors.line } } },
                series: [
                    ...shownGroups.map((group, index) => ({
                        name: group, type: 'bar', stack: 'months', barMaxWidth: 38,
                        itemStyle: { borderRadius: index === shownGroups.length - 1 ? [6, 6, 0, 0] : 0 },
                        data: [...state.items.map(item => valueOf(item, group)), ...blanks],
                    })),
                    {
                        name: `Forecast at ${growth}% a month`, type: 'line', smooth: true, symbolSize: 7,
                        lineStyle: { type: 'dashed', width: 3, color: colors.ink }, itemStyle: { color: colors.ink },
                        data: [...state.items.map((item, index) => index === state.items.length - 1 ? latest : null), ...future.map(entry => entry.value)],
                    },
                ],
            })
            chart('#share-chart', {
                tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                legend: { bottom: 0, type: 'scroll' },
                series: [{
                    type: 'pie', radius: ['48%', '74%'], center: ['50%', '45%'], avoidLabelOverlap: true,
                    itemStyle: { borderColor: colors.paper, borderWidth: 3, borderRadius: 6 },
                    label: { show: false },
                    data: state.groups.map(group => ({
                        name: group, value: groupTotal(group),
                        itemStyle: { opacity: view === 'All' || view === group ? 1 : 0.3 },
                    })),
                }],
            })
        }

        function cell(item, index, field) {
            const isMonth = field === 'month'
            const current = isMonth ? item.month : field === 'onTime' ? item.onTime : item.values[index]
            return el('td', {}, el('input', {
                className: `cell${isMonth ? ' month' : ''}`, type: isMonth ? 'text' : 'number', min: isMonth ? null : '0',
                maxlength: isMonth ? '12' : null, value: String(current ?? 0),
                'aria-label': isMonth ? `Name of month ${item.month}` : `${item.month} ${field === 'onTime' ? 'on time %' : state.groups[index]}`,
                onChange: event => {
                    const value = event.target.value
                    if (isMonth) item.month = value.trim() || item.month
                    else if (field === 'onTime') item.onTime = Math.min(100, Math.max(0, Number(value) || 0))
                    else item.values[index] = Math.max(0, Number(value) || 0)
                    save(`${item.month} updated`, document.getElementById('k-total'))
                },
            }))
        }

        function drawTable() {
            document.getElementById('numbers-head').replaceChildren(el('tr', {},
                el('th', { scope: 'col' }, 'Month'),
                state.groups.map(group => el('th', { scope: 'col' }, group)),
                el('th', { scope: 'col' }, 'On time %'),
                el('th', { scope: 'col' }, el('span', { className: 'muted' }, 'Remove'))))
            document.getElementById('numbers-body').replaceChildren(...state.items.map(item => el('tr', { 'data-card-id': item.id },
                cell(item, 0, 'month'),
                state.groups.map((group, index) => cell(item, index, 'values')),
                cell(item, 0, 'onTime'),
                el('td', {}, el('button', {
                    type: 'button', className: 'remove', 'aria-label': `Remove ${item.month}`,
                    onClick: () => { state.items = state.items.filter(entry => entry.id !== item.id); render(); save('Removed') },
                }, '\u00d7')))))
        }

        function render() {
            const choices = ['All', ...state.groups]
            if (!choices.includes(view)) view = 'All'
            document.getElementById('filters').replaceChildren(...choices.map(name => el('button', {
                type: 'button', 'aria-pressed': String(view === name),
                onClick: () => { view = name; render() },
            }, name)))
            drawTable()
            if (state.items.length) drawSummary()
        }

        document.getElementById('growth').addEventListener('input', drawSummary)
        document.getElementById('add-month').addEventListener('click', () => {
            const last = state.items[state.items.length - 1]
            const item = last
                ? { id: newId(), month: nextMonth(last.month), values: [...last.values], onTime: last.onTime }
                : { id: newId(), month: 'Jan', values: state.groups.map(() => 0), onTime: 100 }
            state.items.push(item)
            render()
            save(`${item.month} added: change its numbers below`, document.querySelector(`[data-card-id="${item.id}"]`))
        })

        async function start() {
            const remembered = saved.load(null)
            const loaded = valid(remembered) ? remembered : await loadJSON('data/metrics.json', SAMPLE)
            // The measure and groups describe the page, so edits to them show; the months are the learner's.
            state = { ...(valid(loaded) ? loaded : SAMPLE), measure: SAMPLE.measure, groups: [...SAMPLE.groups] }
            render()
        }
        start()
    </script>
</body>
</html>
