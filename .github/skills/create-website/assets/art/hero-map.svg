<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <style>
    .pin { animation: bounce 2.4s ease-in-out infinite; transform-origin: 108px 62px; }
    .ring { animation: ring 2.4s ease-out infinite; transform-origin: 108px 76px; }
    .route { stroke-dasharray: 5 6; animation: walk 3s linear infinite; }
