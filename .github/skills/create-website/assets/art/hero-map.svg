    @keyframes ring { 0% { transform: scale(0.3); opacity: 0.9; } 100% { transform: scale(1.6); opacity: 0; } }
    @keyframes walk { to { stroke-dashoffset: -22; } }
    @media (prefers-reduced-motion: reduce) { .pin, .ring, .route { animation: none; } }
