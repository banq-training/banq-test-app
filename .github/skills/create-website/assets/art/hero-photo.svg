<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <style>
    .spark { transform-origin: center; transform-box: fill-box; animation: twinkle 2.2s ease-in-out infinite; }
    .s2 { animation-delay: 0.7s; } .s3 { animation-delay: 1.4s; }
    .stroke { stroke-dasharray: 120; animation: paint 3.2s ease-in-out infinite; }
    @keyframes twinkle { 50% { transform: scale(0.4) rotate(45deg); opacity: 0.5; } }
    @keyframes paint { 0% { stroke-dashoffset: 120; } 55%, 100% { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .spark, .stroke { animation: none; } }
  </style>
