<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .flag { transform-origin: 40px 12px; animation: wave 1.6s ease-in-out infinite; }
    .cloud { animation: drift 6s ease-in-out infinite; }
    @keyframes wave { 50% { transform: skewY(-10deg) scaleX(0.88); } }
    @keyframes drift { 50% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { .flag, .cloud { animation: none; } }
  </style>
  <path class="cloud" d="M7 24h13a4 4 0 0 0 0-8 6 6 0 0 0-11 1 3.5 3.5 0 0 0-2 7z" fill="#dfeaf3"/>
  <path d="M3 57l18-25 8 10 11-19 21 34z" fill="#81b29a"/>
  <path d="M40 23l-7 12 4-2 3 3 3-3 4 2z" fill="#ffffff"/>
  <line x1="40" y1="23" x2="40" y2="6" stroke="#3d405b" stroke-width="2" stroke-linecap="round"/>
  <path class="flag" d="M40 6h13l-3 4 3 4H40z" fill="#e07a5f"/>
</svg>
