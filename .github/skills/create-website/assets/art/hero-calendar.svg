<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <style>
    .page { transform-origin: 80px 30px; animation: flip 5s ease-in-out infinite; }
    .dot { transform-box: fill-box; transform-origin: center; animation: pop 5s ease-in-out infinite; }
    .d2 { animation-delay: 0.4s; } .d3 { animation-delay: 0.8s; }
    @keyframes flip { 0%, 70% { transform: rotateX(0deg); opacity: 1; } 85% { transform: rotateX(80deg); opacity: 0; } 100% { transform: rotateX(0deg); opacity: 1; } }
    @keyframes pop { 0%, 20% { transform: scale(0); } 30%, 80% { transform: scale(1); } 100% { transform: scale(0); } }
    @media (prefers-reduced-motion: reduce) { .page, .dot { animation: none; transform: none; } }
  </style>
  <rect x="30" y="22" width="100" height="90" rx="12" fill="#ffffff" opacity="0.95"/>
  <rect x="30" y="22" width="100" height="26" rx="12" fill="#e76f51"/>
  <rect x="30" y="36" width="100" height="12" fill="#e76f51"/>
  <rect x="50" y="12" width="8" height="20" rx="4" fill="#264653"/>
  <rect x="102" y="12" width="8" height="20" rx="4" fill="#264653"/>
  <g fill="#dde6ee">
    <rect x="42" y="58" width="14" height="12" rx="3"/><rect x="62" y="58" width="14" height="12" rx="3"/>
    <rect x="82" y="58" width="14" height="12" rx="3"/><rect x="102" y="58" width="14" height="12" rx="3"/>
    <rect x="42" y="76" width="14" height="12" rx="3"/><rect x="62" y="76" width="14" height="12" rx="3"/>
    <rect x="82" y="76" width="14" height="12" rx="3"/><rect x="102" y="76" width="14" height="12" rx="3"/>
    <rect x="42" y="94" width="14" height="12" rx="3"/><rect x="62" y="94" width="14" height="12" rx="3"/>
  </g>
  <circle class="dot" cx="69" cy="64" r="4" fill="#2a9d8f"/>
  <circle class="dot d2" cx="89" cy="82" r="4" fill="#e9c46a"/>
  <circle class="dot d3" cx="49" cy="100" r="4" fill="#e76f51"/>
  <g class="page"><rect x="40" y="26" width="80" height="18" rx="4" fill="#f4a261" opacity="0.9"/></g>
</svg>
