<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <style>
    .n { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 4s ease-in-out infinite; }
    .n2 { animation-delay: 0.5s; } .n3 { animation-delay: 1s; }
    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 1.8s ease-in-out infinite; }
    .sp2 { animation-delay: 0.9s; }
    @keyframes sway { 50% { transform: rotate(3deg); } }
    @keyframes twinkle { 50% { transform: scale(0.4) rotate(45deg); opacity: 0.4; } }
    @media (prefers-reduced-motion: reduce) { .n, .spark { animation: none; } }
  </style>
  <g class="n"><rect x="18" y="30" width="44" height="44" rx="5" fill="#fff4c2" transform="rotate(-6 40 52)"/><circle cx="40" cy="30" r="4" fill="#e76f51"/></g>
  <g class="n n2"><rect x="60" y="20" width="44" height="44" rx="5" fill="#dff3ea" transform="rotate(4 82 42)"/><circle cx="82" cy="20" r="4" fill="#2a9d8f"/></g>
  <g class="n n3"><rect x="98" y="38" width="44" height="44" rx="5" fill="#e4ecff" transform="rotate(-3 120 60)"/><circle cx="120" cy="38" r="4" fill="#3a6fd8"/></g>
  <rect x="26" y="48" width="26" height="4" rx="2" fill="#d9c27a"/><rect x="26" y="57" width="18" height="4" rx="2" fill="#d9c27a"/>
  <rect x="68" y="38" width="26" height="4" rx="2" fill="#9fcdb8"/><rect x="68" y="47" width="20" height="4" rx="2" fill="#9fcdb8"/>
  <rect x="106" y="56" width="26" height="4" rx="2" fill="#a9bde8"/><rect x="106" y="65" width="16" height="4" rx="2" fill="#a9bde8"/>
  <path class="spark" d="M132 12l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#ffffff"/>
  <path class="spark sp2" d="M20 92l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffffff"/>
</svg>
